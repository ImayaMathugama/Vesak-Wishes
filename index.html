<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Department - Digital Vesak Dansala</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #fcd34d; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #eab308;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #ca8a04; }
        .wish-box { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .greeting { font-size: 20px; color: #fde047; font-weight: bold; margin-bottom: 10px; }
        .message { font-size: 16px; line-height: 1.6; color: #e2e8f0; }
        .error { color: #ef4444; margin-top: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🪔 IT Dept Vesak Dansala</h1>
    <div class="subtitle">Digital Wish Generation System</div>
    
    <div id="input-stage">
        <input type="text" id="empId" placeholder="Enter Employee ID (e.g., EMP001)" autocomplete="off">
        <button onclick="generateWish()">Receive Blessing</button>
        <div id="error-msg" class="error">Employee ID not found. Please try again!</div>
    </div>

    <div id="wish-box" class="wish-box">
        <div class="greeting" id="user-name">Theruwan Saranai, Subhadra!</div>
        <div class="message" id="wish-text">
            May your code compile on the first run, your production pipelines stay green, and your mind find ultimate peace this Vesak season! 🌾✨
        </div>
        <button onclick="resetForm()" style="margin-top: 20px; background: transparent; color: #94a3b8; border: 1px solid #334155;">Try Another ID</button>
    </div>
</div>

<script>
    // 1. Add your team data here (Keep keys UPPERCASE for easy matching)
    const employeeDb = {
        "EMP001": "Subhadra",
        "EMP002": "Madu",
        "EMP003": "Nethu",
        "EMP004": "Nimal"
    };

    // 2. Add a few tech-themed Vesak wishes to randomize
    const wishes = [
        "May your code compile flawlessly on the first run, your production pipelines stay emerald green, and your life be filled with serene peace! 🪔✨",
        "Wishing you a bug-free life and an overflow of happiness. May this Vesak season clear your mind's cache and refresh your spirit! 🌸",
        "May the light of Vesak illuminate your career path, resolve all merge conflicts in your life, and bring immense peace to you and your family! 🌾"
    ];

    function generateWish() {
        const idInput = document.getElementById('empId').value.trim().toUpperCase();
        const errorMsg = document.getElementById('error-msg');
        const inputStage = document.getElementById('input-stage');
        const wishBox = document.getElementById('wish-box');
        
        if (employeeDb[idInput]) {
            errorMsg.style.display = 'none';
            inputStage.style.display = 'none';
            
            // Set name and pull a random wish from the array
            document.getElementById('user-name').innerText = `Theruwan Saranai, ${employeeDb[idInput]}!`;
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('wish-text').innerText = randomWish;
            
            wishBox.style.display = 'block';
        } else {
            errorMsg.style.display = 'block';
        }
    }

    function resetForm() {
        document.getElementById('empId').value = '';
        document.getElementById('input-stage').style.display = 'block';
        document.getElementById('wish-box').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }
</script>

</body>
</html>
